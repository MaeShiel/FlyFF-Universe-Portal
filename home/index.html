<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: https:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>Flyff U Portal</title>
<link rel="icon" href="../assets/app-icon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-drag">
      <img class="titlebar-logo" src="../assets/app-icon.png" alt="" />
      <span class="titlebar-text">Flyff U Portal</span>
      <button id="settingsBtn" class="titlebar-icon-btn" title="Settings">&#9881;</button>
    </div>
    <div class="titlebar-controls">
      <button id="addAccountBtn" class="primary-btn titlebar-action">+ Add Account</button>
      <span class="titlebar-divider"></span>
      <div class="widget-launcher">
        <button id="widgetMenuBtn" class="titlebar-icon-btn" title="Widgets" aria-label="Widgets" aria-expanded="false">&#129513;</button>
        <div id="widgetMenu" class="widget-menu hidden">
          <button data-widget="fcoin"><span class="widget-menu-icon">&#128176;</span><span>FCoin Calculator</span></button>
          <button data-widget="questlog"><span class="widget-menu-icon">&#128220;</span><span>Quest Log</span></button>
          <button data-widget="notepad"><span class="widget-menu-icon">&#128221;</span><span>Notepad</span></button>
          <button data-widget="todo"><span class="widget-menu-icon">&#9989;</span><span>To-Do</span></button>
          <span class="widget-menu-separator"></span>
          <button id="communityMenuItem"><span class="widget-menu-icon">&#127891;</span><span>Community Resources</span><span class="widget-menu-arrow">&#8250;</span></button>
        </div>
      </div>
      <span class="titlebar-divider"></span>
      <button id="minimizeBtn" class="titlebar-btn" title="Minimize" aria-label="Minimize">&#8722;</button>
      <button id="maximizeBtn" class="titlebar-btn" title="Maximize / Restore" aria-label="Maximize / Restore">&#9633;</button>
      <button id="closeBtn" class="titlebar-btn close" title="Close" aria-label="Close">&#10005;</button>
    </div>
  </div>

  <main>
    <div class="home-links home-links-top">
      <div id="currentVersion" class="version-badge">Current Version</div>
      <!-- TODO: Replace these NeuzOS links with your own GitHub and Discord links. -->
      <a class="home-link-btn" href="https://github.com/flyffu-community/neuzos" target="_blank" rel="noopener noreferrer">
        NeuzOS on GitHub
        <span aria-hidden="true">&#128025;</span>
      </a>
      <a class="home-link-btn discord-link" href="https://discord.gg/mNQ5UT5e9X" target="_blank" rel="noopener noreferrer">
        Join us on Discord!
        <span aria-hidden="true">&#128172;</span>
      </a>
    </div>

    <section class="accounts-section">
      <h2>Accounts</h2>
      <div id="accountsGrid" class="accounts-grid"></div>
    </section>

    <section class="news-section">
      <div class="news-banner">
        <img src="../assets/icons/neuzos_pang.png" alt="" class="news-banner-icon" />
        <div>
          <h2 class="news-title">Welcome to Flyff U Portal!</h2>
          <p class="news-subtitle">Stay updated with the latest news and events from Flyff Universe.</p>
        </div>
      </div>

      <div class="news-tabs-row">
        <div class="news-tabs" id="newsTabs">
          <button class="news-tab active" data-tab="updates">Updates</button>
          <button class="news-tab" data-tab="events">Events</button>
          <button class="news-tab" data-tab="shop">Cash Shop</button>
        </div>
        <button id="refreshNewsBtn" class="secondary-btn">Refresh News &#8635;</button>
      </div>

      <div id="newsPanels"></div>
    </section>
  </main>

  <div id="accountModal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modalTitle">Add Account</h3>
      <form id="accountForm">
        <input type="hidden" id="accountId" />
        <label>Account Label
          <input type="text" id="accName" placeholder="e.g. Knight, Blade" required />
        </label>
        <label>Username
          <input type="text" id="accUsername" autocomplete="off" required />
        </label>
        <label>Password
          <input type="password" id="accPassword" autocomplete="off" required />
        </label>
        <label>Icon
          <input type="hidden" id="accIcon" value="jobs/vagrant.png" />
          <button type="button" id="pickIconBtn" class="icon-picker-trigger">
            <img id="pickIconPreview" src="../assets/icons/jobs/vagrant.png" alt="" />
            <span>Choose Icon...</span>
          </button>
        </label>
        <label>Notes
          <textarea id="accNotes" rows="2" placeholder="Optional"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="secondary-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="iconPickerModal" class="modal hidden">
    <div class="modal-content icon-picker-content">
      <div class="icon-picker-header">
        <input type="text" id="iconSearchInput" placeholder="Search icons..." />
        <button type="button" id="closeIconPickerBtn" class="secondary-btn">Close</button>
      </div>
      <div id="iconPickerBody" class="icon-picker-body"></div>
    </div>
  </div>

  <script src="icon-manifest.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
